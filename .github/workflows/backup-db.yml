name: Backup do banco (criptografado)

# Roda toda madrugada e guarda um dump criptografado do Postgres num
# branch separado ("backups") deste mesmo repositório — nunca junto do
# código-fonte no master, pra não misturar dado real de cliente (CPF,
# PIX, documento assinado) com o histórico de commits do app.
#
# COMO RESTAURAR um backup:
#   1. openssl enc -d -aes-256-cbc -pbkdf2 -salt \
#        -in backup-AAAA-MM-DD.dump.enc -out backup-AAAA-MM-DD.dump \
#        -pass pass:'A_SENHA_DO_SECRET_BACKUP_ENCRYPTION_KEY'
#   2. pg_restore --clean --if-exists -d "$DATABASE_URL" backup-AAAA-MM-DD.dump
#
# Exige 2 secrets configurados em Settings > Secrets and variables >
# Actions deste repositório:
#   - DATABASE_URL             (a mesma connection string do .env)
#   - BACKUP_ENCRYPTION_KEY    (senha de criptografia — gerada à parte,
#                               guardar num cofre de senhas; se perder,
#                               os backups ficam ilegíveis pra sempre)

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 em Brasília (UTC-3), todo dia
  workflow_dispatch: {} # permite rodar manualmente pra testar

permissions:
  contents: write

# Retenção: mantém só os últimos N backups diários, apaga o resto no
# próprio branch de backup pra não crescer pra sempre.
env:
  BACKUP_RETENCAO_DIAS: 30

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente Postgres
        # O postgresql-client padrão do runner Ubuntu é mais antigo que o
        # Postgres 17 da Prisma — pg_dump recusa rodar contra servidor mais
        # novo que ele. Instala direto do repositório oficial do PostgreSQL
        # (pgdg) pra sempre ter versão igual ou mais nova que o servidor.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Gerar dump e criptografar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          data="$(date -u +%Y-%m-%d)"
          # Caminho explícito (não "pg_dump" solto): o runner já vem com um
          # postgresql-client mais antigo instalado, e o /usr/bin/pg_dump
          # genérico continuou apontando pra ele mesmo depois de instalar
          # o pacote -17 — só o binário versionado garante a 17 de verdade.
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges -f "/tmp/backup-$data.dump"
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "/tmp/backup-$data.dump" -out "/tmp/backup-$data.dump.enc" \
            -pass env:BACKUP_ENCRYPTION_KEY
          rm "/tmp/backup-$data.dump"

      - name: Publicar no branch "backups"
        run: |
          set -euo pipefail
          data="$(date -u +%Y-%m-%d)"
          git config user.name "ifree-backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin backups >/dev/null 2>&1; then
            git fetch origin backups
            git checkout backups
          else
            git checkout --orphan backups
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mv "/tmp/backup-$data.dump.enc" .
          git add "backup-$data.dump.enc"

          # Mantém só os últimos BACKUP_RETENCAO_DIAS arquivos — o nome
          # (AAAA-MM-DD) já ordena cronologicamente, sem depender de mtime
          # (que muda toda vez que o runner faz checkout).
          ls -1 backup-*.dump.enc 2>/dev/null | sort | head -n "-${BACKUP_RETENCAO_DIAS}" | xargs -r git rm --

          git commit -m "Backup automático $data" --allow-empty
          git push origin backups
